name: Build and deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: 3.1.64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten toolchain
        run: |
          emcc --version
          command -v emconfigure
          command -v emmake

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Blink WASM runtime
        run: bun run vendor:blink

      - name: Vendor pinned NASM + GNU ld
        run: bun run vendor:toolchain

      - name: Toolchain tests
        run: bun run test:toolchain

      - name: Import classification tests
        run: bun run test:import

      - name: Binary analysis tests
        run: bun run test:analysis

      - name: Execution tests
        run: bun run test:execution

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
